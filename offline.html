<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff;
        font-family: 'Avenir Next', Roboto, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px; text-align: center; }
      p { margin: 0; color: #8e8e93; font-size: 15px; }
      button { margin-top: 8px; padding: 12px 28px; border: 0; border-radius: 22px;
        background: #fff; color: #000; font: inherit; font-weight: 600; font-size: 16px; }
    </style>
  </head>
  <body>
    <strong style="font-size: 20px">No connection</strong>
    <p>Check your internet, then try again.</p>
    <button onclick="location.href = 'https://itsskairo.github.io/chatchat/'">Try again</button>
  </body>
</html>
